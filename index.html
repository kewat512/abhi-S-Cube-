<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0e12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Abhi'S Cube — Learn to Solve, Understand, and Speedsolve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e12; --surface:#171a20; --surface2:#1e222a; --surface3:#272c37;
  --border:#2c303a; --text:#eceef2; --dim:#8b90a0; --dim2:#5c6272;
  --accent:#f5b942; --accent2:#ff8a3d; --accent-dim:#7a5f28;
  --accent-grad:linear-gradient(135deg,#ffcf6b,#f5b942 45%,#ff8a3d);
  --c-white:#f4f4f0; --c-yellow:#ffd400; --c-red:#d7263d; --c-orange:#ff7a1a;
  --c-green:#1f9d55; --c-blue:#2166d1; --c-core:#08090b;
  --good:#3ecf8e; --warn:#e0714a; --serif:'Fraunces',Charter,'Iowan Old Style',Georgia,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;
  --shadow-soft:0 10px 30px -12px rgba(0,0,0,.55);
  --shadow-lift:0 16px 40px -14px rgba(0,0,0,.65);
  --glass:rgba(255,255,255,.02);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden;width:100%;}
body{
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 620px at 14% -8%, rgba(245,185,66,.10), transparent 60%),
    radial-gradient(900px 700px at 100% 0%, rgba(33,102,209,.10), transparent 55%),
    radial-gradient(1200px 900px at 50% 120%, rgba(31,157,85,.06), transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
/* background-attachment:fixed forces the browser to repaint the background
   on every single scroll frame on most phones (iOS Safari and a lot of
   Android WebViews don't composite it as its own layer) — a well-known
   cause of scroll stutter/scroll-appears-frozen bugs. Desktop keeps the
   subtle fixed parallax; mobile just scrolls it normally, which is free. */
@media(max-width:900px){ body{background-attachment:scroll;} }
body.no-scroll{overflow:hidden;}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:-0.01em;margin:0 0 .4em;}
p{line-height:1.55;color:var(--text);margin:.4em 0;}
a{color:var(--accent);}
button{font-family:var(--sans);cursor:pointer;touch-action:manipulation;}
.dim{color:var(--dim);}
::selection{background:var(--accent-dim);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- layout shell ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:264px;flex:0 0 264px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 220px),var(--surface);
  border-right:1px solid var(--border);
  padding:18px 12px 90px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
#sidebar .brand{padding:10px 10px 22px;border-bottom:1px solid var(--border);margin-bottom:10px;}
#sidebar .brand .brand-row{display:flex;align-items:center;gap:11px;}
.sound-toggle-btn{
  margin-left:auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface2);font-size:.95rem;line-height:1;cursor:pointer;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;
}
.sound-toggle-btn:hover{border-color:var(--accent-dim);background:var(--surface3);}
#sidebar .brand .brand-badge{
  width:36px;height:36px;flex:0 0 auto;border-radius:10px;background:var(--accent-grad);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;
  font-size:1.05rem;color:#231a05;box-shadow:0 6px 16px -6px rgba(245,185,66,.6);
}
#sidebar .brand .mark{font-family:var(--serif);font-size:1.32rem;font-weight:700;color:var(--text);letter-spacing:-.01em;line-height:1.15;}
#sidebar .brand .mark span{background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
#sidebar .brand .tag{font-size:.76rem;color:var(--dim);margin-top:9px;line-height:1.45;letter-spacing:.01em;}
.navgroup{margin-bottom:6px;}
.navgroup-title{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim2);padding:16px 12px 6px;font-weight:600;}
.navitem{
  display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;font-size:.88rem;
  color:var(--dim);cursor:pointer;user-select:none;transition:background .15s, color .15s, transform .15s;
  position:relative;
}
.navitem:hover{background:var(--surface2);color:var(--text);transform:translateX(1px);}
.navitem.active{background:linear-gradient(90deg,rgba(245,185,66,.14),rgba(245,185,66,.03));color:var(--text);font-weight:600;box-shadow:inset 2px 0 0 var(--accent);}
.navitem .dot{width:6px;height:6px;border-radius:50%;background:var(--dim2);flex:0 0 auto;transition:background .15s,box-shadow .15s;}
.navitem.active .dot{background:var(--accent);box-shadow:0 0 8px 1px rgba(245,185,66,.7);}
#menuBtn{display:none;}
/* mobile top bar + drawer backdrop — hidden entirely on desktop, only
   activated inside the max-width:900px block below */
#mobileTopbar{display:none;}
#sidebarBackdrop{display:none;}

#main{flex:1;min-width:0;padding:26px 34px 90px;max-width:1180px;}
.section{display:none;}
.section.active{display:block;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.eyebrow{font-size:.72rem;color:var(--accent);text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:700;}
.section > h1{font-size:1.85rem;margin-bottom:.25em;letter-spacing:-.015em;}
.section-intro{color:var(--dim);max-width:640px;margin-bottom:22px;font-size:.98rem;}

/* ---------- cards ---------- */
.card{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 60%),var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow-soft);}
.card h3{font-size:1.05rem;margin-bottom:.3em;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr;}}

.btn{
  background:var(--surface3);color:var(--text);border:1px solid var(--border);border-radius:9px;
  padding:8px 14px;font-size:.85rem;font-weight:500;transition:background .12s,border-color .12s,transform .12s,box-shadow .12s;
}
.btn:hover{background:#323848;border-color:#3a4152;transform:translateY(-1px);box-shadow:0 4px 14px -6px rgba(0,0,0,.5);}
.btn:active{transform:translateY(0);}
.btn.primary{background:var(--accent-grad);color:#231a05;border-color:transparent;font-weight:700;box-shadow:0 6px 18px -8px rgba(245,185,66,.55);}
.btn.primary:hover{filter:brightness(1.07);box-shadow:0 8px 22px -8px rgba(245,185,66,.7);}
.btn.small{padding:5px 10px;font-size:.78rem;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

.pill{display:inline-block;padding:2px 9px;border-radius:100px;font-size:.7rem;font-weight:600;letter-spacing:.02em;background:var(--surface3);color:var(--dim);}
.pill.on{background:rgba(245,185,66,.16);color:var(--accent);}
.pill.good{background:rgba(62,207,142,.16);color:var(--good);}
.pill.warn{background:rgba(224,113,74,.16);color:var(--warn);}

.moves{font-family:var(--mono);font-size:1.02rem;letter-spacing:.03em;color:var(--text);}
.moves .mv{display:inline-block;padding:2px 6px;margin:1px 2px;border-radius:5px;background:var(--surface2);}
.moves .mv.current{background:var(--accent);color:#231a05;}
.moves .mv.done{color:var(--dim2);}
.moves.algo-hidden{display:none;}
.algo-hide-hint{display:none;color:var(--dim2);font-style:italic;font-size:.88rem;padding:4px 0;}
.algo-hide-hint.show{display:block;}
.algo-toggle-row{margin-bottom:6px;}
.moves.moves-grouped{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;}
.mv-group{display:inline-flex;align-items:center;background:rgba(var(--trig-c),.12);border:1px solid rgba(var(--trig-c),.35);border-radius:8px;padding:1px 5px;margin:1px 2px;}
.mv-group .mv{background:transparent;margin:0 1px;padding:2px 3px;color:rgb(var(--trig-c));font-weight:700;}
.mv-group .mv.current{background:rgb(var(--trig-c));color:#111;border-radius:5px;}
.mv-group .mv.done{opacity:.55;}
.trigger-inline-pill{display:inline-flex;align-items:center;padding:3px 10px;margin:1px 2px;border-radius:100px;
  font-size:.68rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;cursor:pointer;
  background:rgba(var(--trig-c),.16);color:rgb(var(--trig-c));border:1px solid rgba(var(--trig-c),.3);
  transition:background .15s,border-color .15s;
}
.trigger-inline-pill:hover{background:rgba(var(--trig-c),.28);}

/* ---------- cube net ---------- */
.cube-panel{
  background:radial-gradient(600px 300px at 20% 0%, rgba(245,185,66,.05), transparent 60%),var(--surface);
  border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:var(--shadow-lift);
}
.cube-wrap{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start;}

/* view toggle tabs */
.view-toggle{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;margin-bottom:12px;}
.view-toggle button{background:transparent;border:none;color:var(--dim);font-size:.78rem;font-weight:600;padding:6px 12px;border-radius:7px;transition:background .15s,color .15s;}
.view-toggle button.active{background:var(--accent-grad);color:#231a05;}
.view-toggle button:not(.active):hover{color:var(--text);}
.cube-visual{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;}
.drag-hint{font-size:.72rem;color:var(--dim2);text-align:center;margin-top:8px;letter-spacing:.02em;}
.view-toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.reset-view-btn{background:var(--surface2);border:1px solid var(--border);color:var(--dim);border-radius:7px;padding:6px 9px;font-size:.85rem;transition:color .12s,background .12s;}
.reset-view-btn:hover{color:var(--text);background:var(--surface3);}

.net{
  display:grid;grid-template-columns:repeat(12,20px);grid-template-rows:repeat(9,20px);gap:2px;
  flex:0 0 auto;
}
@media(max-width:520px){
  .net{grid-template-columns:repeat(12,17px);grid-template-rows:repeat(9,17px);}
}
.sticker{
  border-radius:3px;position:relative;transition:transform .15s, box-shadow .15s;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);
}
.sticker.hl{animation:pop .55s ease;box-shadow:0 0 0 2px var(--accent),inset 0 0 0 1px rgba(0,0,0,.25);}
@keyframes pop{0%{transform:scale(1);}35%{transform:scale(1.16);}100%{transform:scale(1);}}
.sticker.blank{visibility:hidden;}
.col-U{background:var(--c-yellow);} .col-D{background:var(--c-white);}
.col-F{background:var(--c-green);} .col-B{background:var(--c-blue);}
.col-L{background:var(--c-orange);} .col-R{background:var(--c-red);}

.mini-net-wrap{flex:0 0 auto;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px;}
.mini-net{display:grid;grid-template-columns:repeat(12,7px);grid-template-rows:repeat(9,7px);gap:1px;}
.mini-net .sticker{border-radius:1px;box-shadow:none;}
/* small static 3D cube — still used for the single case now open in the
   case player (buildCaseInteractive), not for grid thumbnails anymore. */
.mini-cube3d-wrap{
  width:86px;height:86px;flex:0 0 auto;position:relative;overflow:hidden;
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;
}
.mini-cube3d-wrap .cube3d-scene{
  position:absolute;top:52%;left:50%;width:260px;height:260px;
  transform:translate(-50%,-50%) scale(.335);transform-origin:center center;
  pointer-events:none;cursor:default;
}
.mini-cube3d-wrap .cube3d-scene::after{content:none;}
.group-header{margin:22px 0 8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);border-bottom:1px solid var(--border);padding-bottom:6px;}
.group-header:first-child{margin-top:4px;}

/* ---------- 3D cube (cubie-based, physically animated) ---------- */
.cube3d-scene{
  width:260px;height:260px;perspective:1000px;flex:0 0 auto;margin:0 auto;
  touch-action:none;cursor:grab;position:relative;
}
.cube3d-scene::after{
  content:'';position:absolute;left:50%;bottom:14px;width:150px;height:26px;
  transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(0,0,0,.35), rgba(0,0,0,0) 70%);
  pointer-events:none;
}
.cube3d-scene:active{cursor:grabbing;}
.cube3d{
  width:100%;height:100%;position:relative;transform-style:preserve-3d;
  transform:rotateX(-24deg) rotateY(-34deg);
  transition:transform .08s linear;
  will-change:transform;
}
.cube3d.spinning{transition:none;}
.cubie-layer{position:absolute;inset:0;transform-style:preserve-3d;}
.cubie-anchor{position:absolute;top:50%;left:50%;width:0;height:0;transform-style:preserve-3d;}
.turn-pivot{position:absolute;top:50%;left:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform;}
.cubie{position:absolute;width:46px;height:46px;left:-23px;top:-23px;transform-style:preserve-3d;}
.cubie-face{
  position:absolute;width:46px;height:46px;background-color:var(--c-core);
  border-radius:6px;box-shadow:0 0 0 1px rgba(0,0,0,.55);
}
.cubie-face.cf-front{transform:translateZ(23px);}
.cubie-face.cf-back{transform:rotateY(180deg) translateZ(23px);}
.cubie-face.cf-right{transform:rotateY(90deg) translateZ(23px);}
.cubie-face.cf-left{transform:rotateY(-90deg) translateZ(23px);}
.cubie-face.cf-top{transform:rotateX(90deg) translateZ(23px);}
.cubie-face.cf-bottom{transform:rotateX(-90deg) translateZ(23px);}
/* per-facet ambient shading so unlit sides read as physically lit, not flat */
.cubie-face.cf-right,.cubie-face.cf-left{background-image:linear-gradient(rgba(0,0,0,.14),rgba(0,0,0,.14));}
.cubie-face.cf-top{background-image:linear-gradient(rgba(255,255,255,.08),rgba(255,255,255,.08));}
.cubie-face.cf-bottom,.cubie-face.cf-back{background-image:linear-gradient(rgba(0,0,0,.26),rgba(0,0,0,.26));}
.cubie-sticker{
  position:absolute;inset:3px;border-radius:4px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.3), inset 0 3px 4px rgba(255,255,255,.3), inset 0 -4px 5px rgba(0,0,0,.2);
  transition:transform .15s;
}
.cubie-sticker.hl{animation:pop3d .6s ease;box-shadow:0 0 0 2px var(--accent), inset 0 0 0 1px rgba(0,0,0,.3);}
@keyframes pop3d{0%{transform:scale(1);}35%{transform:scale(1.14);}100%{transform:scale(1);}}
.cube-controls{flex:1;min-width:260px;}
.movepad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px;}
.movepad button{padding:8px 0;border-radius:7px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:.85rem;transition:background .12s,transform .1s;}
.movepad button:hover{background:var(--surface3);transform:translateY(-1px);}
.cube-status{font-size:.8rem;color:var(--dim);margin-top:8px;min-height:1.2em;}
.cube-status.solved{color:var(--good);font-weight:600;}

/* algorithm player */
.algo-block{border:1px solid var(--border);border-radius:10px;padding:14px 16px;background:var(--surface2);margin:10px 0;}
.algo-header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.algo-name{font-weight:700;font-size:.95rem;}
.step-caption{font-size:.8rem;color:var(--dim);min-height:1.4em;margin-top:6px;}

.why-btn{background:none;border:1px solid var(--accent-dim);color:var(--accent);border-radius:100px;padding:5px 13px;font-size:.78rem;font-weight:700;}
.why-btn:hover{background:rgba(245,185,66,.1);}
.why-panel{display:none;margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--surface);border-left:3px solid var(--accent);}
.why-panel.open{display:block;}
.why-panel h4{font-size:.82rem;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}

/* case card — collapsed by default; the cube only exists once opened */
.case-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px;transition:border-color .2s,box-shadow .2s;}
.case-card.open{border-color:var(--accent-dim);box-shadow:0 10px 26px -14px rgba(245,185,66,.35);}
.case-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;cursor:pointer;user-select:none;}
.case-title{font-weight:700;font-size:1rem;}
.case-sub{color:var(--dim);font-size:.82rem;}
.case-chevron{color:var(--dim2);font-size:1rem;line-height:1;padding:2px 2px 0;transition:transform .3s cubic-bezier(.4,0,.2,1),color .2s;}
.case-card.open .case-chevron{transform:rotate(180deg);color:var(--accent);}
/* grid-rows 0fr→1fr trick: animates height without a JS-measured pixel value */
.case-collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.4,0,.2,1);}
.case-collapse > div{overflow:hidden;}
.case-card.open .case-collapse{grid-template-rows:1fr;}
.case-cube-panel{margin-top:10px;}
.case-card.open .case-cube-panel{animation:caseOpen .5s cubic-bezier(.16,1,.3,1);}
@keyframes caseOpen{0%{opacity:0;transform:translateY(8px) scale(.97);}100%{opacity:1;transform:translateY(0) scale(1);}}
.case-body{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:10px;}
@media(max-width:760px){.case-body{grid-template-columns:1fr;}}
.kv{font-size:.85rem;margin:5px 0;}
.kv b{color:var(--dim);font-weight:600;display:inline-block;min-width:96px;}
.speed-row{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.78rem;color:var(--dim);}
.speed-row .speed-label{min-width:118px;}
.speed-row input[type=range]{flex:1;max-width:180px;accent-color:var(--accent);}
.case-movepad{margin-top:6px;}

/* case grid — lightweight tiles; the heavy per-case interactive cube only
   ever gets built once you open the case player, never for the grid itself */
.case-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:4px;}
.case-grid .case-card{margin-bottom:0;padding:14px 12px 12px;content-visibility:auto;contain-intrinsic-size:0 160px;}
.case-card{cursor:pointer;}
.case-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:var(--accent-dim);}
/* grid tiles stack vertically (thumb → name → pills) — the wide flex-row
   .case-top from the old inline-accordion layout doesn't fit a ~150px tile */
.case-grid .case-top{flex-direction:column;align-items:center;text-align:center;gap:6px;}
.case-grid .case-title{font-size:.9rem;}
.case-grid .case-sub{font-size:.74rem;}
.case-grid .btn-row{justify-content:center;}
.case-card .case-open-arrow{color:var(--dim2);font-size:1.1rem;transition:transform .18s,color .18s;}
.case-card:hover .case-open-arrow{transform:translateX(2px);color:var(--accent);}
/* thumbnail placeholder — reserves the exact size of the real mini cube so
   nothing shifts when the IntersectionObserver swaps the real 3D thumb in */
.mini-cube3d-wrap.pending{display:flex;align-items:center;justify-content:center;}
.mini-cube3d-wrap.pending::after{content:'';width:22px;height:22px;border-radius:6px;background:var(--surface3);}

/* case player — single-case focused view. Prev/Next/Back are pinned to a
   sticky top bar so switching cases never requires scrolling to find them. */
.case-player-top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
  justify-content:space-between;flex-wrap:wrap;padding:10px 0 16px;
  background:linear-gradient(180deg,var(--bg) 82%,rgba(13,14,18,0));margin-bottom:6px;
}
.case-player-title{flex:1;min-width:160px;}
.case-player-title h2{font-size:1.4rem;margin:0;}
.case-player-crumb{font-size:.72rem;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:2px;}
.case-player-nav{display:flex;gap:8px;align-items:center;}

/* opportunities (Dashboard) */

.quiz-card{max-width:560px;}

.quiz-options button.correct{background:rgba(62,207,142,.18);border-color:var(--good);}

/* dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media(max-width:800px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:linear-gradient(160deg,rgba(245,185,66,.06),rgba(255,255,255,0) 65%),var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow-soft);}

/* filter bar */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.filterbar input[type=text]{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 12px;font-size:.85rem;min-width:200px;}

.mistake{border-left:3px solid var(--warn);padding:8px 12px;margin:8px 0;background:rgba(224,113,74,.06);border-radius:0 6px 6px 0;font-size:.86rem;}
.step-list{padding-left:0;list-style:none;counter-reset:step;}
.step-list li{counter-increment:step;padding-left:30px;position:relative;margin-bottom:10px;font-size:.9rem;}
.step-list li::before{content:counter(step);position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:var(--surface3);color:var(--accent);font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;}

hr.rule{border:none;border-top:1px solid var(--border);margin:20px 0;}

/* =========================================================================
   MOBILE — drawer sidebar with backdrop, a persistent top bar, larger touch
   targets throughout, and a thumb-reachable bottom bar for case Prev/Next.
   ========================================================================= */
@media(max-width:900px){
  #mobileTopbar{
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:45;

  #menuBtn{
    display:flex;width:38px;height:38px;border-radius:9px;background:var(--surface2);

  #main{padding:16px 16px calc(90px + env(safe-area-inset-bottom));max-width:none;}
  .cube-wrap{flex-direction:column;align-items:center;}
  .cube-controls{width:100%;min-width:0;}

  /* bigger, thumb-friendly touch targets everywhere */
  .btn{padding:11px 15px;font-size:.92rem;min-height:42px;}
  .btn.small{padding:9px 13px;font-size:.85rem;min-height:38px;}
  .movepad{grid-template-columns:repeat(4,1fr);gap:8px;}
  .movepad button{padding:13px 0;font-size:.95rem;min-height:44px;}
  .navitem{padding:11px 12px;font-size:.92rem;}
  .filterbar input[type=text]{width:100%;min-width:0;font-size:16px;}
  .quiz-options button{padding:13px;min-height:46px;}
  .recog-chip,.chip{padding:7px 13px;font-size:.82rem;}
  .timer-display{font-size:2.3rem;padding:18px 0 8px;}
  .case-grid{grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:10px;}
  .stat-num{font-size:1.6rem;}
  .section > h1{font-size:1.5rem;}

  /* case player: sticky top sits below the mobile bar, and Prev/Next drop
     into a fixed bottom bar within thumb reach instead of forcing a stretch
     to the top of the screen */
  .case-player-top{top:54px;padding:10px 0 10px;}
  .case-player-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:46;display:flex;gap:10px;
    background:var(--surface2);border-top:1px solid var(--border);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .case-player-nav button{flex:1;}
  #sec-case.section{padding-bottom:74px;}
}
@media(max-width:480px){
  .case-grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));}
  .cube3d-scene{transform:scale(.92);margin:-10px auto;}

}
@media(max-width:360px){
  #main{padding:12px 10px calc(90px + env(safe-area-inset-bottom));}
  .cube3d-scene{transform:scale(.78);margin:-28px auto;}
  .mini-cube3d-wrap{width:72px;height:72px;}

/* ---------- Scan Your Cube ---------- */
.scan-modes{display:flex;gap:8px;margin-bottom:16px;}
.scan-modes .chip{cursor:pointer;}
.scan-dropzone{
  border:2px dashed var(--border);border-radius:14px;padding:26px 16px;text-align:center;
  cursor:pointer;transition:border-color .18s,background .18s;background:var(--surface);
}

.scan-stage canvas{display:block;max-width:100%;border-radius:10px;border:1px solid var(--border);touch-action:none;}
.scan-dot{
  position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;
  border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.5);

.scan-result-card{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--border);
  border-radius:12px;background:var(--surface);margin-bottom:10px;cursor:pointer;transition:border-color .18s;}
.scan-result-card:hover{border-color:var(--accent-dim);}
.scan-result-rank{font-size:1.3rem;font-weight:800;color:var(--dim2);min-width:28px;text-align:center;}
.scan-result-card:first-child .scan-result-rank{color:var(--accent);}
.scan-confidence-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:6px;width:140px;}
.scan-confidence-fill{height:100%;background:var(--accent-grad);}

/* ---------- Common Triggers ---------- */
.trigger-used-wrap{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);}
.trigger-used-row{margin-top:10px;}

}

<body>
<div id="mobileTopbar">
  <button id="menuBtn" aria-label="Open menu" aria-expanded="false">☰</button>
  <span class="mobile-brand">Abhi<em>&rsquo;S</em> Cube</span>
  <button class="sound-toggle-btn mobile-sound-toggle" type="button">🔊</button>
</div>
<div id="sidebarBackdrop"></div>
<div id="app">
  <nav id="sidebar"></nav>
  <main id="main"></main>
</div>

<script>
/* =========================================================================
   CUBE ENGINE — 6-face sticker model, verified move definitions.
   Faces: U,D,F,B,L,R each a 9-element array (row-major, 0..8), viewed
   straight-on from outside the cube. Solved state = each face one color.
   ========================================================================= */
function solvedState(){
  return {U:Array(9).fill('U'),D:Array(9).fill('D'),F:Array(9).fill('F'),
          B:Array(9).fill('B'),L:Array(9).fill('L'),R:Array(9).fill('R')};
}
function cloneState(s){return {U:s.U.slice(),D:s.D.slice(),F:s.F.slice(),B:s.B.slice(),L:s.L.slice(),R:s.R.slice()};}
function rotCW(f){return [f[6],f[3],f[0],f[7],f[4],f[1],f[8],f[5],f[2]];}
function rotCCW(f){return [f[2],f[5],f[8],f[1],f[4],f[7],f[0],f[3],f[6]];}
function setI(arr,idx,vals){idx.forEach((i,k)=>arr[i]=vals[k]);}

function turnU_(s){
  const n=cloneState(s); n.U=rotCW(s.U);
  setI(n.R,[0,1,2],[s.B[0],s.B[1],s.B[2]]);
  setI(n.F,[0,1,2],[s.R[0],s.R[1],s.R[2]]);
  setI(n.L,[0,1,2],[s.F[0],s.F[1],s.F[2]]);
  setI(n.B,[0,1,2],[s.L[0],s.L[1],s.L[2]]);
  return n;
}
function turnD_(s){
  const n=cloneState(s); n.D=rotCW(s.D);
  setI(n.R,[6,7,8],[s.F[6],s.F[7],s.F[8]]);
  setI(n.B,[6,7,8],[s.R[6],s.R[7],s.R[8]]);
  setI(n.L,[6,7,8],[s.B[6],s.B[7],s.B[8]]);
  setI(n.F,[6,7,8],[s.L[6],s.L[7],s.L[8]]);
  return n;
}
function turnR_(s){
  const n=cloneState(s); n.R=rotCW(s.R);
  setI(n.U,[2,5,8],[s.F[2],s.F[5],s.F[8]]);
  setI(n.F,[2,5,8],[s.D[2],s.D[5],s.D[8]]);
  setI(n.D,[2,5,8],[s.B[6],s.B[3],s.B[0]]);
  setI(n.B,[0,3,6],[s.U[8],s.U[5],s.U[2]]);
  return n;
}
function turnL_(s){
  const n=cloneState(s); n.L=rotCW(s.L);
  setI(n.F,[0,3,6],[s.U[0],s.U[3],s.U[6]]);
  setI(n.D,[0,3,6],[s.F[0],s.F[3],s.F[6]]);
  setI(n.B,[2,5,8],[s.D[6],s.D[3],s.D[0]]);
  setI(n.U,[0,3,6],[s.B[8],s.B[5],s.B[2]]);
  return n;
}
function turnF_(s){
  const n=cloneState(s); n.F=rotCW(s.F);
  setI(n.R,[0,3,6],[s.U[6],s.U[7],s.U[8]]);
  setI(n.D,[0,1,2],[s.R[6],s.R[3],s.R[0]]);
  setI(n.L,[2,5,8],[s.D[0],s.D[1],s.D[2]]);
  setI(n.U,[6,7,8],[s.L[8],s.L[5],s.L[2]]);
  return n;
}
function turnB_(s){
  const n=cloneState(s); n.B=rotCW(s.B);
  setI(n.L,[0,3,6],[s.U[2],s.U[1],s.U[0]]);
  setI(n.D,[6,7,8],[s.L[0],s.L[3],s.L[6]]);
  setI(n.R,[2,5,8],[s.D[8],s.D[7],s.D[6]]);
  setI(n.U,[0,1,2],[s.R[2],s.R[5],s.R[8]]);
  return n;
}
const BASE_TURNS={U:turnU_,D:turnD_,F:turnF_,B:turnB_,L:turnL_,R:turnR_};

/* ---------- slice turns (M/E/S) — derived by direct analogy to the base
   face-turn functions above, using the "middle" index set of each face
   instead of the outer column/row that a face turn touches. By convention
   M follows L's direction, E follows D's, S follows F's. ---------- */
function turnM_(s){ // between L/R, follows L
  const n=cloneState(s);
  setI(n.F,[1,4,7],[s.U[1],s.U[4],s.U[7]]);
  setI(n.D,[1,4,7],[s.F[1],s.F[4],s.F[7]]);
  setI(n.B,[1,4,7],[s.D[7],s.D[4],s.D[1]]);
  setI(n.U,[1,4,7],[s.B[7],s.B[4],s.B[1]]);
  return n;
}
function turnE_(s){ // between U/D, follows D
  const n=cloneState(s);
  setI(n.R,[3,4,5],[s.F[3],s.F[4],s.F[5]]);
  setI(n.B,[3,4,5],[s.R[3],s.R[4],s.R[5]]);
  setI(n.L,[3,4,5],[s.B[3],s.B[4],s.B[5]]);
  setI(n.F,[3,4,5],[s.L[3],s.L[4],s.L[5]]);
  return n;
}
function turnS_(s){ // between F/B, follows F
  const n=cloneState(s);
  setI(n.R,[1,4,7],[s.U[3],s.U[4],s.U[5]]);
  setI(n.D,[3,4,5],[s.R[7],s.R[4],s.R[1]]);
  setI(n.L,[1,4,7],[s.D[3],s.D[4],s.D[5]]);
  setI(n.U,[3,4,5],[s.L[7],s.L[4],s.L[1]]);
  return n;
}
// Applies a base function 3 times — the "prime"/inverse of a single CW step,
// used to build composite wide/rotation moves out of the verified base and
// slice turns without hand-deriving a fresh permutation for each.
function inv(fn){ return s=>fn(fn(fn(s))); }
// Wide (double-layer) turns: outer face + the slice turned to match it.
// M/E/S each default to matching L/D/F respectively, so the moves that
// match R/U/B instead use the slice's inverse.
const WIDE_TURNS={
  r: s=>inv(turnM_)(turnR_(s)),
  l: s=>turnM_(turnL_(s)),
  u: s=>inv(turnE_)(turnU_(s)),
  d: s=>turnE_(turnD_(s)),
  f: s=>turnS_(turnF_(s)),
  b: s=>inv(turnS_)(turnB_(s)),
};
// Whole-cube rotations: x matches R, y matches U, z matches F — each is the
// matching outer face, then its slice, then the opposite face inverted.
const ROTATION_TURNS={
  x: s=>inv(turnL_)(inv(turnM_)(turnR_(s))),
  y: s=>inv(turnD_)(inv(turnE_)(turnU_(s))),
  z: s=>inv(turnB_)(turnS_(turnF_(s))),
};
const ALL_TURNS=Object.assign({},BASE_TURNS,{M:turnM_,E:turnE_,S:turnS_},WIDE_TURNS,ROTATION_TURNS);

function applyMove(state,move){
  const face=move[0];
  const mod=move.slice(1); // '', "'", "2"
  const fn=ALL_TURNS[face];
  if(!fn) return state;
  let s=state;
  const times = mod==="2"?2:(mod==="'"?3:1);
  for(let i=0;i<times;i++) s=fn(s);
  return s;
}
function applyAlgorithm(state,algStr){
  return parseAlg(algStr).reduce((s,m)=>applyMove(s,m),state);
}
function parseAlg(algStr){
  return algStr.trim().split(/\s+/).filter(Boolean);
}
function isSolved(s){
  return ['U','D','F','B','L','R'].every(f=>s[f].every(c=>c===s[f][0]));
}
function diffStickers(a,b){
  const out=[];
  ['U','D','F','B','L','R'].forEach(f=>{
    for(let i=0;i<9;i++) if(a[f][i]!==b[f][i]) out.push(f+i);
  });
  return out;
}
function scrambleMoves(n){
  const faces=['U','D','F','B','L','R'];
  const mods=['','\'','2'];
  const opp={U:'D',D:'U',F:'B',B:'F',L:'R',R:'L'};
  const out=[];
  let last=null,lastAxis=null;
  for(let i=0;i<n;i++){
    let f;
    do{f=faces[Math.floor(Math.random()*6)];}
    while(f===last || (lastAxis && opp[f]===last));
    last=f; lastAxis=f;
    out.push(f+mods[Math.floor(Math.random()*3)]);
  }
  return out;
}

/* =========================================================================
   MOVE SOUND — synthesized cube-turn click, no audio files needed.
   Lazily creates a single shared AudioContext on the first move (browsers
   block audio before a user gesture anyway), and shapes a short noise-burst
   "click" with a quick pitch/gain envelope. Prime moves get a touch lower
   pitch and double (2) moves get two quick clicks, so a turn's direction
   and length are audible, not just visible.
   ========================================================================= */
let soundEnabled = true;
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function clickOnce(ctx, delay, basePitch){
  const t0 = ctx.currentTime + delay;
  // Short filtered noise burst reads as a plasticky "click" much more than
  // a pure tone would — closer to an actual cube turn than a beep.
  const bufferSize = Math.floor(ctx.sampleRate * 0.05);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = basePitch;
  filter.Q.value = 1.1;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.35, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+0.06);
  noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  noise.start(t0); noise.stop(t0+0.07);
}
function playMoveSound(move){
  if(!soundEnabled) return;
  const ctx = getAudioCtx();
  if(!ctx) return;
  const prime = move.endsWith("'");
  const double = move.endsWith('2');
  const basePitch = prime ? 1500 : 1900;
  clickOnce(ctx, 0, basePitch);
  if(double) clickOnce(ctx, 0.07, basePitch);
}
function setSoundEnabled(v){
  soundEnabled = v;
  document.querySelectorAll('.sound-toggle-btn').forEach(b=>{
    b.textContent = soundEnabled ? '🔊' : '🔇';
    b.setAttribute('aria-label', soundEnabled ? 'Mute move sounds' : 'Unmute move sounds');
    b.title = soundEnabled ? 'Move sounds on — click to mute' : 'Move sounds off — click to unmute';
  });
}

/* =========================================================================
   APP STATE
   ========================================================================= */
let cube = solvedState();
let cubeHistory = [];
let lastHighlight = [];
let playToken = 0;

const progress = {
  learned:new Set(), needsPractice:new Set(), difficult:new Set(),
  recog:{attempts:0, correct:0, times:[], byCase:{}},
  sessions:1, timesSolved:[],
  levelsSeen:new Set()
};

function doMove(move, opts={}){
  const prev = cube;
  cube = applyMove(cube, move);
  lastHighlight = diffStickers(prev, cube);
  cubeHistory.push(move);
  if(!opts.silent) playMoveSound(move);
  if(opts.silent) return Promise.resolve();
  // Only the mount(s) on the currently visible page actually get animated
  // and repainted — every hidden page (Home, Notation, every Beginner
  // Level, Timer, Recognition…) that was ever opened stays registered for
  // when you come back to it, but skipping DOM work on the ones you can't
  // see is what keeps things smooth as a session goes on.
  const jobs = [];
  cubeMounts.forEach(m=>{
    if(!isMountVisible(m)) return;
    if(m.dataset.type==='cube3d') jobs.push(animateMove3D(m, move).then(()=>renderCubeInto(m)));
    else renderCubeInto(m);
  });
  updateCubeStatus();
  // Returning this lets callers (playAlgorithm) wait for the physical turn
  // to actually finish before starting the next one — without it, a fast
  // playback speed could fire the next move's animation before the last
  // one settled, which is what caused the cube to visibly glitch/stutter.
  return Promise.all(jobs);
}
// Applies a whole sequence to the shared cube state with zero DOM work in
// between — used for scrambles, undo-replay and "set up this case", which
// used to repaint every registered mount after every single intermediate
// move (up to 20x over for a scramble) for no visible benefit.
function applyMovesSilently(moves){
  moves.forEach(m=>{ cube = applyMove(cube, m); cubeHistory.push(m); });
  lastHighlight = [];
}
function resetCube(){ cube=solvedState(); cubeHistory=[]; lastHighlight=[]; renderCube(); updateCubeStatus(); }
function scrambleCube(){
  resetCube();
  const seq = scrambleMoves(20);
  applyMovesSilently(seq);
  renderCube();
  updateCubeStatus();
  return seq;
}
async function playAlgorithm(algStr, {onStep, speed=550}={}){
  const token = ++playToken;
  const moves = parseAlg(algStr);
  for(let i=0;i<moves.length;i++){
    if(token!==playToken) return;
    const movePromise = doMove(moves[i]);
    if(onStep) onStep(i, moves.length, moves[i]);
    // Wait for the physical turn AND the pacing delay together, so the
    // next move never starts mid-animation regardless of chosen speed.
    await Promise.all([movePromise, sleep(speed)]);
  }
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

/* ---------- speak-the-moves (text-to-speech) ----------
   Optional narration during "Show & Solve" playback. Each player instance
   gets its own on/off checkbox (see buildSpeakToggle); the flag it controls
   just lives on a small object passed in, so multiple players on screen
   don't fight over one global. Speech is fire-and-forget and cancels any
   utterance still talking so it never falls behind fast playback speeds. */
const SPEECH_LETTER_NAMES = {U:'U',D:'D',F:'F',B:'B',L:'L',R:'R',M:'M',E:'E',S:'S',
  r:'R',l:'L',u:'U',d:'D',f:'F',b:'B',x:'X',y:'Y',z:'Z'};
function moveToSpeech(move){
  const face = move[0];
  const mod = move.slice(1);
  let word = SPEECH_LETTER_NAMES[face] || face;
  if('rludfb'.includes(face)) word = 'wide ' + word;
  if(mod==="'") word += ' prime';
  else if(mod==='2') word += ' two';
  return word;
}
const speechSupported = (typeof window!=='undefined') && 'speechSynthesis' in window;
function speakMove(move){
  if(!speechSupported) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(moveToSpeech(move));
    u.rate = 1.15;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
// Returns {row, state} — state.on reflects the checkbox live; row is ready to append.
function buildSpeakToggle(){
  const state = {on:false};
  const row = el('label','dim speak-toggle');
  row.style.display='inline-flex'; row.style.alignItems='center'; row.style.gap='6px'; row.style.marginLeft='10px'; row.style.fontSize='.8rem';
  if(!speechSupported){
    row.textContent = '🔇 Speech not supported in this browser';
    return {row, state};
  }
  const cb = document.createElement('input');
  cb.type='checkbox';
  cb.onchange=()=>{ state.on = cb.checked; if(!cb.checked) window.speechSynthesis.cancel(); };
  row.appendChild(cb);
  row.appendChild(document.createTextNode('🔊 Speak moves'));
  return {row, state};
}


function stopPlayback(){ playToken++; }

/* =========================================================================
   RENDERING — cube net
   layout (12x9 grid): columns 0-2 L, 3-5 F, 6-8 R, 9-11 B ; U above F(row0-2 col3-5 shifted up), D below
   We build with explicit grid-area placement per cell.
   ========================================================================= */
const NET_MAP = []; // {face, idx, col, row}
(function buildNetMap(){
  // U occupies rows0-2, cols3-5
  for(let r=0;r<3;r++)for(let c=0;c<3;c++) NET_MAP.push({face:'U',idx:r*3+c,col:3+c,row:r});
  // row3-5: L(0-2) F(3-5) R(6-8) B(9-11)
  const rowFaces=[['L',0],['F',3],['R',6],['B',9]];
  for(const [face,offset] of rowFaces){
    for(let r=0;r<3;r++)for(let c=0;c<3;c++) NET_MAP.push({face,idx:r*3+c,col:offset+c,row:3+r});
  }
  // D rows6-8 cols3-5
  for(let r=0;r<3;r++)for(let c=0;c<3;c++) NET_MAP.push({face:'D',idx:r*3+c,col:3+c,row:6+r});
})();

function buildNetDOM(container){
  container.innerHTML='';
  NET_MAP.forEach(cell=>{
    const d=document.createElement('div');
    d.className='sticker';
    d.style.gridColumn=(cell.col+1);
    d.style.gridRow=(cell.row+1);
    d.dataset.face=cell.face;
    d.dataset.idx=cell.idx;
    container.appendChild(d);
  });
}

/* ---------- 3D cube rendering (per-cubie, physically animated) ---------- */
const CUBIE=46, GAP=4, STEP=CUBIE+GAP, HALF=CUBIE/2;
const CUBIE_COORDS=[];
for(let x=-1;x<=1;x++) for(let y=-1;y<=1;y++) for(let z=-1;z<=1;z++){
  if(x===0&&y===0&&z===0) continue; // true center cubie is never visible
  CUBIE_COORDS.push({x,y,z});
}
// Maps each outward face direction of a cubie at (x,y,z) to the sticker
// array cell (face letter + 0..8 index) it represents. Derived directly
// from the U/D/F/B/L/R turn definitions above so a physical layer turn and
// the underlying state transform always agree on what moved where.
const DIR_DEFS={
  U:{cls:'cf-top',    outward:c=>c.y===1,  idx:c=>(c.z+1)*3+(c.x+1)},
  D:{cls:'cf-bottom', outward:c=>c.y===-1, idx:c=>(1-c.z)*3+(c.x+1)},
  F:{cls:'cf-front',  outward:c=>c.z===1,  idx:c=>(1-c.y)*3+(c.x+1)},
  B:{cls:'cf-back',   outward:c=>c.z===-1, idx:c=>(1-c.y)*3+(1-c.x)},
  R:{cls:'cf-right',  outward:c=>c.x===1,  idx:c=>(1-c.y)*3+(1-c.z)},
  L:{cls:'cf-left',   outward:c=>c.x===-1, idx:c=>(1-c.y)*3+(c.z+1)},
};
const FACE_ORDER=['U','D','F','B','L','R'];
// Rotation axis + base angle (single clockwise turn) for each face, matching
// the exact cycle each turnX_ function above produces.
const MOVE_DEF={
  U:{axis:'Y', test:c=>c.y===1,  angle:-90},
  D:{axis:'Y', test:c=>c.y===-1, angle:90},
  F:{axis:'Z', test:c=>c.z===1,  angle:-90},
  B:{axis:'Z', test:c=>c.z===-1, angle:90},
  R:{axis:'X', test:c=>c.x===1,  angle:-90},
  L:{axis:'X', test:c=>c.x===-1, angle:90},
};
// Slice turns spin only the middle layer of cubies on that axis, in the
// same direction as the face each one is defined to match (M~L, E~D, S~F).
MOVE_DEF.M={axis:'X', test:c=>c.x===0, angle:MOVE_DEF.L.angle};
MOVE_DEF.E={axis:'Y', test:c=>c.y===0, angle:MOVE_DEF.D.angle};
MOVE_DEF.S={axis:'Z', test:c=>c.z===0, angle:MOVE_DEF.F.angle};
// Wide turns spin the outer layer plus the middle layer together, same
// angle as the outer face they're built from.
MOVE_DEF.r={axis:'X', test:c=>c.x===1||c.x===0,  angle:MOVE_DEF.R.angle};
MOVE_DEF.l={axis:'X', test:c=>c.x===-1||c.x===0, angle:MOVE_DEF.L.angle};
MOVE_DEF.u={axis:'Y', test:c=>c.y===1||c.y===0,  angle:MOVE_DEF.U.angle};
MOVE_DEF.d={axis:'Y', test:c=>c.y===-1||c.y===0, angle:MOVE_DEF.D.angle};
MOVE_DEF.f={axis:'Z', test:c=>c.z===1||c.z===0,  angle:MOVE_DEF.F.angle};
MOVE_DEF.b={axis:'Z', test:c=>c.z===-1||c.z===0, angle:MOVE_DEF.B.angle};
// Whole-cube rotations spin every cubie together — x matches R, y matches
// U, z matches F.
MOVE_DEF.x={axis:'X', test:()=>true, angle:MOVE_DEF.R.angle};
MOVE_DEF.y={axis:'Y', test:()=>true, angle:MOVE_DEF.U.angle};
MOVE_DEF.z={axis:'Z', test:()=>true, angle:MOVE_DEF.F.angle};

function buildCube3DDOM(container){
  container.innerHTML='';
  container.classList.add('cube3d-scene');
  const cube3d = document.createElement('div');
  cube3d.className='cube3d';
  const layer = document.createElement('div');
  layer.className='cubie-layer';
  CUBIE_COORDS.forEach(c=>{
    const anchor = document.createElement('div');
    anchor.className='cubie-anchor';
    anchor.dataset.x=c.x; anchor.dataset.y=c.y; anchor.dataset.z=c.z;
    anchor.style.transform = `translate3d(${c.x*STEP}px, ${-c.y*STEP}px, ${c.z*STEP}px)`;
    const cubie = document.createElement('div');
    cubie.className='cubie';
    FACE_ORDER.forEach(dir=>{
      const face = document.createElement('div');
      face.className='cubie-face '+DIR_DEFS[dir].cls;
      if(DIR_DEFS[dir].outward(c)){
        const sticker = document.createElement('div');
        sticker.className='cubie-sticker';
        sticker.dataset.face=dir;
        sticker.dataset.idx=DIR_DEFS[dir].idx(c);
        face.appendChild(sticker);
      }
      cubie.appendChild(face);
    });
    anchor.appendChild(cubie);
    layer.appendChild(anchor);
  });
  cube3d.appendChild(layer);
  container.appendChild(cube3d);
  attachDragRotate(container, cube3d);
  container._cubieLayer = layer;
}
// One shared drag-tracker for every cube scene on the page (rather than a
// fresh pair of window-level mousemove/mouseup listeners per cube — which
// used to pile up as more cases got opened over a session and was a real
// source of the app getting sluggish the longer you used it).
let _activeDrag = null;
(function initSharedDrag(){
  const move = (x,y)=>{ if(_activeDrag) _activeDrag.move(x,y); };
  const end = ()=>{ if(_activeDrag){ _activeDrag.end(); _activeDrag=null; } };
  window.addEventListener('mousemove', e=>move(e.clientX,e.clientY));
  window.addEventListener('mouseup', end);
})();
function attachDragRotate(scene, cubeEl){
  let lastX=0, lastY=0, rx=-24, ry=-34;
  const apply=()=>{ cubeEl.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)'; };
  apply();
  scene._resetRotation=()=>{ rx=-24; ry=-34; apply(); };
  function start(x,y){ lastX=x; lastY=y; cubeEl.classList.add('spinning'); _activeDrag={move:onMove,end:onEnd}; }
  function onMove(x,y){
    const dx=x-lastX, dy=y-lastY;
    lastX=x; lastY=y;
    ry += dx*0.5;
    rx = Math.max(-85, Math.min(85, rx - dy*0.5));
    apply();
  }
  function onEnd(){ cubeEl.classList.remove('spinning'); }
  scene.addEventListener('mousedown', e=>{ start(e.clientX,e.clientY); e.preventDefault(); });
  scene.addEventListener('touchstart', e=>{ const t=e.touches[0]; start(t.clientX,t.clientY); }, {passive:true});
  scene.addEventListener('touchmove', e=>{ if(_activeDrag&&_activeDrag.move===onMove){ const t=e.touches[0]; onMove(t.clientX,t.clientY); } }, {passive:true});
  scene.addEventListener('touchend', ()=>{ if(_activeDrag&&_activeDrag.end===onEnd){ onEnd(); _activeDrag=null; } });
}

// Physically rotates the 9 cubies of one layer around the cube's own
// center, then hands them back to their static slots and lets
// renderCubeInto paint the post-move colors — the visual end point of the
// turn and the new state always coincide, so the snap is invisible.
function animateMove3D(container, move, duration=260){
  return new Promise(resolve=>{
    const layer = container._cubieLayer;
    if(!layer){ resolve(); return; }
    const def = MOVE_DEF[move[0]];
    if(!def){ resolve(); return; }
    const mod = move.slice(1);
    const angle = def.angle * (mod==="2"?2:(mod==="'"?-1:1));
    const anchors=[...layer.querySelectorAll('.cubie-anchor')].filter(a=>
      def.test({x:+a.dataset.x,y:+a.dataset.y,z:+a.dataset.z}));
    const pivot = document.createElement('div');
    pivot.className='turn-pivot';
    layer.appendChild(pivot);
    anchors.forEach(a=>pivot.appendChild(a));
    pivot.getBoundingClientRect(); // force reflow so the transition catches the start state
    pivot.style.transition = `transform ${duration}ms cubic-bezier(.4,0,.2,1)`;
    requestAnimationFrame(()=>{ pivot.style.transform = `rotate${def.axis}(${angle}deg)`; });
    setTimeout(()=>{
      anchors.forEach(a=>layer.appendChild(a));
      pivot.remove();
      resolve();
    }, duration+30);
  });
}

function renderCubeInto(container){
  if(!container) return;
  if(!container.dataset.built){
    if(container.dataset.type==='cube3d') buildCube3DDOM(container);
    else buildNetDOM(container);
    container.dataset.built='1';
  }
  if(container.dataset.type==='cube3d'){
    const cells = container.querySelectorAll('.cubie-sticker');
    for(const el of cells){
      const f=el.dataset.face, i=+el.dataset.idx;
      const color = cube[f][i];
      el.className = 'cubie-sticker col-'+color;
      if(lastHighlight.includes(f+i)) el.classList.add('hl');
    }
  } else {
    const cells = container.querySelectorAll('[data-face]');
    for(const el of cells){
      const f=el.dataset.face, i=+el.dataset.idx;
      const color = cube[f][i];
      el.className = 'sticker col-'+color;
      if(lastHighlight.includes(f+i)) el.classList.add('hl');
    }
  }
}
let cubeMounts = [];
// offsetParent is null for display:none — this also skips animating the
// 3D cube while the Net view toggle has it hidden (and vice versa), which
// used to burn a full turn animation on an invisible element every move.
function isMountVisible(mEl){ const sec = mEl.closest('.section'); return !!sec && sec.classList.contains('active') && mEl.offsetParent !== null; }
function registerCubeMount(el, type){ if(type) el.dataset.type=type; cubeMounts.push(el); renderCubeInto(el); }
function renderCube(){ cubeMounts.forEach(m=>{ if(isMountVisible(m)) renderCubeInto(m); }); }


/* ---------- static case thumbnails (independent of the shared cube panel) ---------- */
function computeCaseState(c){
  let s = solvedState();
  parseAlg(inverseAlg(c.algorithm)).forEach(m=>{ s = applyMove(s, m); });
  return s;
}
function buildMiniNet(state){
  const wrap = el('div','mini-net-wrap');
  const net = el('div','mini-net');
  NET_MAP.forEach(cell=>{
    const d = document.createElement('div');
    d.className = 'sticker col-'+state[cell.face][cell.idx];
    d.style.gridColumn = (cell.col+1);
    d.style.gridRow = (cell.row+1);
    net.appendChild(d);
  });
  wrap.appendChild(net);
  return wrap;
}
function buildMiniCube3D(state){
  const wrap = el('div','mini-cube3d-wrap');
  wrap.appendChild(buildMiniCube3DScene(state));
  return wrap;
}
function buildMiniCube3DScene(state){
  // Same per-cubie DOM shape as the big interactive cube (buildCube3DDOM),
  // just painted once from a fixed `state` object instead of the shared
  // global `cube`, with no drag handlers — a static but genuinely 3D,
  // perspective-correct thumbnail.
  const scene = el('div','cube3d-scene');
  const cube3d = el('div','cube3d');
  cube3d.style.transform = 'rotateX(-24deg) rotateY(-34deg)';
  const layer = el('div','cubie-layer');
  CUBIE_COORDS.forEach(c=>{
    const anchor = document.createElement('div');
    anchor.className = 'cubie-anchor';
    anchor.style.transform = `translate3d(${c.x*STEP}px, ${-c.y*STEP}px, ${c.z*STEP}px)`;
    const cubie = document.createElement('div');
    cubie.className = 'cubie';
    FACE_ORDER.forEach(dir=>{
      const face = document.createElement('div');
      face.className = 'cubie-face '+DIR_DEFS[dir].cls;
      if(DIR_DEFS[dir].outward(c)){
        const sticker = document.createElement('div');
        sticker.className = 'cubie-sticker col-'+state[dir][DIR_DEFS[dir].idx(c)];
        face.appendChild(sticker);
      }
      cubie.appendChild(face);
    });
    anchor.appendChild(cubie);
    layer.appendChild(anchor);
  });
  cube3d.appendChild(layer);
  scene.appendChild(cube3d);
  return scene;
}
// Thumbnails used to be a full 3D cube (~150 DOM nodes, CSS 3D transforms,
// gradients) built lazily via IntersectionObserver — but even staggered,
// that was still too much per-thumbnail work on real devices and the
// observer added its own edge cases (this is what was behind cases "all
// arriving at once" and the jank/scroll problems on mobile). A flat sticker
// net (~54 tiny plain divs, no 3D compositing at all) is cheap enough to
// build for all 57 OLL cases synchronously with no lazy-loading needed.
function buildCaseThumb(c){
  return buildMiniNet(computeCaseState(c));
}
function updateCubeStatus(){
  document.querySelectorAll('.cube-status.global-status').forEach(el=>{
    if(isSolved(cube)){ el.textContent='Solved ✓'; el.classList.add('solved'); }
    else { el.textContent = cubeHistory.length? (cubeHistory.length+' moves from start') : 'Ready'; el.classList.remove('solved'); }
  });
}
</script>

<script>
/* =========================================================================
   UTIL
   ========================================================================= */
function inverseAlg(algStr){
  return parseAlg(algStr).reverse().map(m=>{
    if(m.endsWith("'")) return m[0];
    if(m.endsWith('2')) return m;
    return m+"'";
  }).join(' ');
}
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
// Small debounce so typing in a search box (which can rebuild 50-100+ case
// cards per keystroke) waits for a short pause instead of doing full work
// on every single character — the single biggest cause of typing feeling
// laggy in the F2L/OLL/PLL and Algorithm Trainer search boxes.
function debounce(fn, ms=140){
  let t=null;
  return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); };
}
function uid(){ return 'id'+Math.random().toString(36).slice(2,9); }

/* =========================================================================
   CONTENT DATA
   ========================================================================= */
const NOTATION = [
  {mv:'U', name:'Up', desc:'Turn the top layer 90° clockwise, as viewed looking straight down at the top face.'},

  {mv:"D'", name:'Down Prime', desc:'Turn the bottom layer 90° counter-clockwise.'},
  {mv:'D2', name:'Down Double', desc:'Turn the bottom layer 180°.'},
  {mv:'F', name:'Front', desc:'Turn the face nearest you 90° clockwise, as viewed straight-on.'},
  {mv:"F'", name:'Front Prime', desc:'Turn the front face 90° counter-clockwise.'},
  {mv:'F2', name:'Front Double', desc:'Turn the front face 180°.'},
  {mv:'B', name:'Back', desc:'Turn the far face 90° clockwise, as viewed from behind the cube (imagine walking around to look at it).'},
  {mv:"B'", name:'Back Prime', desc:'Turn the back face 90° counter-clockwise.'},
  {mv:'B2', name:'Back Double', desc:'Turn the back face 180°.'},
  {mv:'L', name:'Left', desc:'Turn the left face 90° clockwise, as viewed straight-on from the left side.'},
  {mv:"L'", name:'Left Prime', desc:'Turn the left face 90° counter-clockwise.'},

const CROSS_SECTION = {
  id:'cross', title:'Cross',
  concept:'The cross is 4 edge pieces, all matched to one center, arranged in a plus-sign around it. Beginners often chase "any white edge" and end up scrambling pieces they already placed — instead, plan the whole cross before you turn anything. Cross is done intuitively (no algorithms to memorize) both in the beginner method and in CFOP — it\'s the same skill either way.',
  points:[
    'The center determines the face\'s permanent color — pick one center color (commonly white) to build your cross on.',
    'Each cross edge has <i>two</i> colors. It isn\'t solved just because one side shows the cross color — the other sticker must also match the neighboring center it sits against.',
    'Look for all 4 cross-color edges before moving anything. Building a mental map first means far fewer wasted turns.',

const F2L_CASES = [
  {id:'f2l-01', name:'Connected Pair, Right Slot', group:'Connected Pair', num:1, recognition:'The corner and its matching edge are already stuck together in the top layer, forming a little block above the empty slot. Angled to the right — check the sibling case in this family for the mirror.', algorithm:"U R U' R'", why:'The setup moves slide the connected block into position above the gap, then the final trigger drops both pieces in and locks them together in one motion.', playable:true},

  {id:'f2l-03', name:'Connected Pair, Deep Right', group:'Connected Pair', num:3, recognition:'The corner and its matching edge are already stuck together in the top layer, forming a little block above the empty slot. Angled to the right — check the sibling case in this family for the mirror.', algorithm:"U' R U R' U2 R U' R'", why:'The setup moves slide the connected block into position above the gap, then the final trigger drops both pieces in and locks them together in one motion.', playable:true},

// Swipe left/right anywhere on an open case page moves to the next/previous
// case — the same gesture speedcubers already expect from flashcard apps.
// Ignored while the drag actually starts on the 3D cube itself, so it never
// fights with rotating the cube.
(function setupCaseSwipe(){
  let sx=0, sy=0, tracking=false;
  document.addEventListener('touchstart', e=>{
    const sec = document.getElementById('sec-case');
    if(!sec || !sec.classList.contains('active') || e.target.closest('.cube3d-scene')){ tracking=false; return; }
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; tracking=true;
  }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(!tracking) return;
    tracking=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)<60 || Math.abs(dx)<Math.abs(dy)*1.5) return;
    const sec = document.getElementById('sec-case');
    const btn = sec && sec.querySelector(dx<0 ? '.case-player-next' : '.case-player-prev');
    if(btn && !btn.disabled) btn.click();
  }, {passive:true});
})();

/* Builds a moves-list display with its own Hide/Show toggle — used by every
   place in the app that prints out an algorithm, so you can cover it up
   and quiz yourself no matter where you're looking at a case. Also splits
   the algorithm into color-coded chunks wherever a Common Trigger is
   recognized, with a small tappable label right next to that chunk (jumps
   to the full explanation on the Common Triggers page). Returns the
   wrapper to insert, plus the underlying .mv spans in original move order
   (for step-highlighting during playback) and a setHidden() so a "Play"
   button can force it open. */
function buildMovesDisplay(algorithm, {startHidden=false}={}){
  const wrap = el('div');
  const toggleRow = el('div','btn-row algo-toggle-row');
  const toggleBtn = el('button','btn small','Hide algorithm');
  toggleRow.appendChild(toggleBtn);

  const tokens = parseAlg(algorithm);
  const movesEl = el('div','moves moves-grouped');
  const spans = [];
  segmentAlgorithm(tokens).forEach(seg=>{
    if(seg.trigger){
      const group = el('span','mv-group');
      group.style.setProperty('--trig-c', seg.trigger.color);
      for(let k=0;k<seg.len;k++){
        const s = el('span','mv', tokens[seg.start+k]);
        group.appendChild(s);
        spans.push(s);
      }
      movesEl.appendChild(group);
      const labelBtn = el('span','trigger-inline-pill', seg.trigger.name);
      labelBtn.style.setProperty('--trig-c', seg.trigger.color);
      labelBtn.onclick = ()=>{
        showSection('triggers');
        setTimeout(()=>{
          const target = document.getElementById('trigger-'+seg.trigger.id);
          if(target){
            target.scrollIntoView({behavior:'smooth',block:'start'});
            target.classList.add('flash');
            setTimeout(()=>target.classList.remove('flash'), 1600);
          }
        }, 60);
      };
      movesEl.appendChild(labelBtn);
    } else {
      for(let k=0;k<seg.len;k++){
        const s = el('span','mv', tokens[seg.start+k]);
        movesEl.appendChild(s);
        spans.push(s);
      }
    }
  });
  const hint = el('div','algo-hide-hint','••• algorithm hidden — try to recall it, then tap "Show algorithm" •••');
  let hidden = startHidden;
  function apply(){
    movesEl.classList.toggle('algo-hidden', hidden);
    hint.classList.toggle('show', hidden);
    toggleBtn.textContent = hidden ? 'Show algorithm' : 'Hide algorithm';
  }
  toggleBtn.onclick = ()=>{ hidden = !hidden; apply(); };
  apply();
  wrap.appendChild(toggleRow); wrap.appendChild(movesEl); wrap.appendChild(hint);
  return { wrap, movesEl, spans, setHidden(v){ hidden=v; apply(); }, isHidden:()=>hidden };
}

/* ---------- self-contained cube engine, one per opened case ----------
   Reuses the same pure state/render primitives as the global cube (applyMove,
   parseAlg, buildCube3DDOM, animateMove3D…) but keeps its own state and its
   own mounts, so opening a case never touches the shared cube elsewhere in
   the app and several cases could in principle be open at once. */
function makeLocalCubeEngine(){
  let state = solvedState();
  let highlight = [];
  let moveCount = 0;
  let mounts = [];
  let token = 0;
  function paint(mEl,type){
    if(!mEl.dataset.built){
      if(type==='cube3d') buildCube3DDOM(mEl); else buildNetDOM(mEl);
      mEl.dataset.built='1';
    }
    if(type==='cube3d'){
      mEl.querySelectorAll('.cubie-sticker').forEach(s=>{
        const f=s.dataset.face,i=+s.dataset.idx;
        s.className='cubie-sticker col-'+state[f][i];
        if(highlight.includes(f+i)) s.classList.add('hl');
      });
    } else {
      mEl.querySelectorAll('[data-face]').forEach(s=>{
        const f=s.dataset.face,i=+s.dataset.idx;
        s.className='sticker col-'+state[f][i];
        if(highlight.includes(f+i)) s.classList.add('hl');
      });
    }
  }
  function renderAll(){ mounts.forEach(m=>paint(m.el,m.type)); }
  function mount(mEl,type){ mEl.dataset.type=type; mounts.push({el:mEl,type}); paint(mEl,type); return mEl; }
  async function doMove(move){
    const prev = state;
    state = applyMove(state, move);
    highlight = diffStickers(prev, state);
    moveCount++;
    playMoveSound(move);
    await Promise.all(mounts.map(m=> m.type==='cube3d'
      ? animateMove3D(m.el, move).then(()=>paint(m.el,m.type))
      : (paint(m.el,m.type), Promise.resolve())));
  }
  function reset(){ state=solvedState(); highlight=[]; moveCount=0; renderAll(); }
  function setupCase(algorithm){
    state = solvedState(); highlight=[]; moveCount=0;
    parseAlg(inverseAlg(algorithm)).forEach(m=>{ state = applyMove(state, m); });
    renderAll();
  }
  async function playAlgorithm(algStr, {speed=550, onStep}={}){
    const my = ++token;
    const moves = parseAlg(algStr);
    for(let i=0;i<moves.length;i++){
      if(my!==token) return;
      await doMove(moves[i]);
      if(onStep) onStep(i, moves.length, moves[i]);
      await sleep(speed);
    }
  }
  return { mount, doMove, reset, setupCase, playAlgorithm,
    get state(){return state;}, get moveCount(){return moveCount;} };
}
