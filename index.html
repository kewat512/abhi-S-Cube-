  visual.appendChild(el('div','drag-hint','drag to rotate the cube'));
  cwrap.appendChild(visual);
  engine.mount(scene,'cube3d');

  const controls = el('div','cube-controls');
  const status = el('div','cube-status','Ready');
  controls.appendChild(status);
  function refreshStatus(){
    const solved = isSolved(engine.state);
    status.textContent = solved ? 'Solved ✓' : (engine.moveCount ? engine.moveCount+' moves from start' : 'Ready');
    status.classList.toggle('solved', solved);
  }

  // Move pad sits right under the cube (and its Solved/status line) so it's
  // the first thing your thumb reaches — no scrolling past the algorithm
  // and buttons just to turn a face yourself.
  controls.appendChild(el('div','dim','Or turn faces yourself:'));
  const pad = el('div','movepad case-movepad');
  ['U',"U'",'U2','D',"D'",'D2','F',"F'",'F2','B',"B'",'B2','L',"L'",'L2','R',"R'",'R2'].forEach(m=>{
    const b = el('button', null, m);
    b.onclick=async ()=>{ if(playing) return; await engine.doMove(m); refreshStatus(); };
    pad.appendChild(b);
  });
  controls.appendChild(pad);

  // If a case has more than one known algorithm, show a small picker so the
  // player can try each one — clicking a pill swaps which algorithm is
  // displayed, set up, and animated by "Show & Solve" below.
  let algPicker = null;
  if(algs.length>1){
    algPicker = el('div','btn-row alg-picker'); algPicker.style.margin='10px 0 0'; algPicker.style.flexWrap='wrap';
    algPicker.appendChild(el('span','dim','Algorithm: '));
    algs.forEach((a,i)=>{
      const b = el('button','btn small'+(i===0?' primary':''), 'Alg '+(i+1));
      b.onclick=()=>{ if(playing) return; selectAlg(i); };
      algPicker.appendChild(b);
    });
    controls.appendChild(algPicker);
  }

  let movesDisplay = buildMovesDisplay(algs[algIdx]);
  movesDisplay.wrap.style.margin='10px 0 4px';
  let spans = movesDisplay.spans;
  const movesHolder = el('div');
  movesHolder.appendChild(movesDisplay.wrap);
  controls.appendChild(movesHolder);
  const caption = el('div','step-caption');
  controls.appendChild(caption);

  const btnRow = el('div','btn-row'); btnRow.style.marginTop='6px';
  const setupBtn = el('button','btn small','Show this case');
  const solveBtn = el('button','btn small primary','▶ Show & Solve');
  const resetBtn = el('button','btn small','↺ Reset');
  btnRow.appendChild(setupBtn); btnRow.appendChild(solveBtn); btnRow.appendChild(resetBtn);
  controls.appendChild(btnRow);

  const SPEEDS = [{ms:1400,label:'Very slow'},{ms:900,label:'Slow'},{ms:550,label:'Normal'},{ms:320,label:'Fast'},{ms:180,label:'Very fast'}];
  let speedIdx = 2;
  const speedRow = el('div','speed-row');
  const speedLabel = el('span','speed-label','Speed: '+SPEEDS[speedIdx].label);
  const speedInput = document.createElement('input');
  speedInput.type='range'; speedInput.min='0'; speedInput.max='4'; speedInput.step='1'; speedInput.value=String(speedIdx);
  speedInput.oninput=()=>{ speedIdx=+speedInput.value; speedLabel.textContent='Speed: '+SPEEDS[speedIdx].label; };
  speedRow.appendChild(speedLabel); speedRow.appendChild(speedInput);
  const speakToggle = buildSpeakToggle();
  speedRow.appendChild(speakToggle.row);
  controls.appendChild(speedRow);

  let setupPanel = (c.section==='OLL' || c.section==='PLL') ? buildSetupAlgPanel(c, algs[algIdx]) : null;

  function selectAlg(i){
    algIdx = i;
    if(algPicker) [...algPicker.querySelectorAll('button')].forEach((b,k)=>b.classList.toggle('primary', k===i));
    movesHolder.innerHTML='';
    movesDisplay = buildMovesDisplay(algs[algIdx]);
    movesDisplay.wrap.style.margin='10px 0 4px';
    spans = movesDisplay.spans;
    movesHolder.appendChild(movesDisplay.wrap);
    if(setupPanel){
      const fresh = buildSetupAlgPanel(c, algs[algIdx]);
      setupPanel.replaceWith(fresh);
      setupPanel = fresh;
    }
    resetBtn.onclick();
  }

  setupBtn.onclick=()=>{
    if(playing) return;
    engine.setupCase(algs[algIdx]);
    spans.forEach(s=>s.classList.remove('done','current'));
    caption.textContent = 'Cube set to this case — see if you recognize it, then press "Show & Solve".';
    refreshStatus();
  };
  resetBtn.onclick=()=>{
    if(playing) return;
    engine.reset();
    spans.forEach(s=>s.classList.remove('done','current'));
    caption.textContent = '';
    solveBtn.textContent = '▶ Show & Solve';
    refreshStatus();
  };
  let playing = false;
  async function showAndSolve(){
    if(playing) return;
    playing = true;
    movesDisplay.setHidden(false);
    solveBtn.disabled = true; setupBtn.disabled = true; resetBtn.disabled = true;
    engine.setupCase(algs[algIdx]);
    spans.forEach(s=>s.classList.remove('done','current'));
    caption.textContent = 'Case set up — solving…';
    await sleep(280);
    await engine.playAlgorithm(algs[algIdx], {speed:SPEEDS[speedIdx].ms, onStep:(i,total,mv)=>{
      spans.forEach((s,k)=>{ s.classList.toggle('current',k===i); if(k<i) s.classList.add('done'); });
      caption.textContent = 'Move '+(i+1)+' of '+total+': '+mv;
      if(speakToggle.state.on) speakMove(mv);
      refreshStatus();
    }});
    spans.forEach(s=>{s.classList.remove('current'); s.classList.add('done');});
    caption.textContent = 'Solved. Press "↻ Replay" to watch it again.';
    solveBtn.textContent = '↻ Replay';
    solveBtn.disabled = false; setupBtn.disabled = false; resetBtn.disabled = false;
    playing = false;
    refreshStatus();
  }
  solveBtn.onclick = showAndSolve;

  cwrap.appendChild(controls);
  wrap.appendChild(cwrap);
  if(setupPanel) wrap.appendChild(setupPanel);
  if(c.why) wrap.appendChild(buildWhyPanel(c.why));
  refreshStatus();
  return wrap;
}

/* A case tile is intentionally dumb: a thumbnail (lazy-built, see
   buildCaseThumb), name, and status pills. Nothing interactive lives here —
   clicking anywhere opens the dedicated case player, which is the only
   place a case's cube engine actually gets built. */
function buildCaseCard(c){
  const card = el('div','case-card');
  card.dataset.caseId = c.id;

  const top = el('div','case-top');
  top.appendChild(buildCaseThumb(c));
  const info = el('div');
  info.style.flex='1';
  info.innerHTML = '<div class="case-title">'+c.name+(c.num?' <span class="dim" style="font-weight:400;">(ref. #'+c.num+')</span>':'')+'</div>'+
    '<div class="case-sub">'+(c.group||'')+(c.kind?' · '+c.kind:'')+(c.diff?' · '+c.diff:'')+'</div>';
  top.appendChild(info);

  const pills = el('div','btn-row'); pills.style.alignItems='center'; pills.style.flexWrap='nowrap';
  if(progress.learned.has(c.id)) pills.appendChild(el('span','pill good','Learned'));
  if(progress.needsPractice.has(c.id)) pills.appendChild(el('span','pill on','Practice'));
  pills.appendChild(el('span','case-open-arrow','→'));
  top.appendChild(pills);
  card.appendChild(top);

  card.onclick=()=>openCasePlayer(c.id);
  return card;
}
function refreshDashboardIfOpen(){ const d=document.getElementById('sec-dashboard'); if(d && d.classList.contains('active')){ d.remove(); showSection('dashboard'); } }

/* =========================================================================
   CASE PLAYER — one case at a time, full-screen-focused, with the case's
   own interactive cube. Reuses the same sec-case DOM node for every case
   instead of caching one section per case id, so a long practice session
   never accumulates dozens of live cube engines in hidden DOM.
   ========================================================================= */
function findCase(id){ return ALL_CASES.find(c=>c.id===id); }
function neighborCaseId(tag, id, dir){
  const order = (currentCaseOrder[tag] && currentCaseOrder[tag].length)
    ? currentCaseOrder[tag]
    : ALL_CASES.filter(c=>c.section===tag).map(c=>c.id);
  const idx = order.indexOf(id);
  if(idx===-1) return null;
  const n = idx+dir;
  return (n>=0 && n<order.length) ? order[n] : null;
}
function openCasePlayer(id){
  const c = findCase(id);
  if(!c) return;
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('active', n.dataset.id===c.section.toLowerCase()));
  let sec = document.getElementById('sec-case');
  if(!sec){ sec = el('section','section'); sec.id='sec-case'; document.getElementById('main').appendChild(sec); }
  sec.classList.add('active');
  renderCasePlayer(sec, c);
  window.scrollTo({top:0,behavior:'instant'});
  progress.levelsSeen.add('case-'+c.id);
}
function backToCaseList(tag){
  // Force a fresh rebuild so Learned/Practice pills picked up in the
  // player are reflected the moment you land back on the grid.
  const id = tag.toLowerCase();
  const cached = document.getElementById('sec-'+id);
  if(cached) cached.remove();
  showSection(id);
}
function renderCasePlayer(sec, c){
  sec.innerHTML='';

  const order = (currentCaseOrder[c.section] && currentCaseOrder[c.section].length)
    ? currentCaseOrder[c.section] : ALL_CASES.filter(x=>x.section===c.section).map(x=>x.id);
  const pos = order.indexOf(c.id);
  const prevId = neighborCaseId(c.section, c.id, -1);
  const nextId = neighborCaseId(c.section, c.id, 1);

  const topbar = el('div','case-player-top');
  const backBtn = el('button','btn small','← '+c.section+' cases');
  backBtn.onclick=()=>backToCaseList(c.section);
  const titleWrap = el('div','case-player-title');
  titleWrap.innerHTML = '<div class="case-player-crumb">'+c.section+(c.group?' · '+c.group:'')+
    (pos!==-1?' <span class="case-player-count">'+(pos+1)+' / '+order.length+'</span>':'')+
    '</div><h2>'+c.name+'</h2>';
  const nav = el('div','case-player-nav');
  const prevBtn = el('button','btn case-player-prev','‹ Prev'); prevBtn.disabled=!prevId;
  prevBtn.onclick=()=>{ if(prevId) openCasePlayer(prevId); };
  const nextBtn = el('button','btn primary case-player-next','Next ›'); nextBtn.disabled=!nextId;
  nextBtn.onclick=()=>{ if(nextId) openCasePlayer(nextId); };
  nav.appendChild(prevBtn); nav.appendChild(nextBtn);
  topbar.appendChild(backBtn); topbar.appendChild(titleWrap); topbar.appendChild(nav);
  sec.appendChild(topbar);

  const wrap = el('div','case-player-wrap');

  const markRow = el('div','case-player-progress-row');
  const learnBtn = el('button','btn small'+(progress.learned.has(c.id)?' primary':''), progress.learned.has(c.id)?'✓ Learned':'Mark Learned');
  const practiceBtn = el('button','btn small'+(progress.needsPractice.has(c.id)?' primary':''), progress.needsPractice.has(c.id)?'✓ Flagged':'Needs Practice');
  learnBtn.onclick=()=>{
    if(progress.learned.has(c.id)){progress.learned.delete(c.id);} else {progress.learned.add(c.id); progress.needsPractice.delete(c.id);}
    learnBtn.className='btn small'+(progress.learned.has(c.id)?' primary':'');
    learnBtn.textContent = progress.learned.has(c.id)?'✓ Learned':'Mark Learned';
    practiceBtn.className='btn small'+(progress.needsPractice.has(c.id)?' primary':'');
    practiceBtn.textContent = progress.needsPractice.has(c.id)?'✓ Flagged':'Needs Practice';
    refreshDashboardIfOpen();
  };
  practiceBtn.onclick=()=>{
    if(progress.needsPractice.has(c.id)){progress.needsPractice.delete(c.id);} else {progress.needsPractice.add(c.id); progress.learned.delete(c.id);}
    practiceBtn.className='btn small'+(progress.needsPractice.has(c.id)?' primary':'');
    practiceBtn.textContent = progress.needsPractice.has(c.id)?'✓ Flagged':'Needs Practice';
    learnBtn.className='btn small'+(progress.learned.has(c.id)?' primary':'');
    learnBtn.textContent = progress.learned.has(c.id)?'✓ Learned':'Mark Learned';
    refreshDashboardIfOpen();
  };
  markRow.appendChild(learnBtn); markRow.appendChild(practiceBtn);
  wrap.appendChild(markRow);

  const detail = el('div','card');
  detail.innerHTML = '<div class="kv"><b>Recognition</b>'+c.recognition+'</div>'+
    (c.mistake?'<div class="mistake">'+c.mistake+'</div>':'');
  wrap.appendChild(detail);

  wrap.appendChild(buildCaseInteractive(c));
  sec.appendChild(wrap);
}
// Left/Right arrow keys move between cases while the case player is open —
// the same shortcut speedcubers already expect from flashcard-style tools.
document.addEventListener('keydown', e=>{
  if(e.target && /input|textarea/i.test(e.target.tagName)) return;
  const sec = document.getElementById('sec-case');
  if(!sec || !sec.classList.contains('active')) return;
  if(e.key==='ArrowRight'){ const b=sec.querySelector('.case-player-next'); if(b && !b.disabled) b.click(); }
  else if(e.key==='ArrowLeft'){ const b=sec.querySelector('.case-player-prev'); if(b && !b.disabled) b.click(); }
});
/* Jump from a Dashboard opportunity straight into its case player. */
function jumpToCase(id){ openCasePlayer(id); }
</script>

<script>
/* =========================================================================
   TRAINER, RECOGNITION, TIMER, DASHBOARD
   ========================================================================= */
function buildTrainer(sec){
  sec.innerHTML = '<div class="eyebrow">Practice</div><h1>Algorithm Trainer</h1>'+
    '<p class="section-intro">Search across every case in this app. Hide the algorithm, try to recall it, then reveal to check yourself.</p>';
  const {panel} = makeCubePanel();
  sec.appendChild(panel);

  const filterBar = el('div','filterbar');
  const search = document.createElement('input'); search.type='text'; search.placeholder='Search all cases…';
  filterBar.appendChild(search);
  const sections = ['All','F2L','OLL','PLL','Needs practice','Learned'];
  let active='All';
  sections.forEach(s=>{
    const chip = el('div','chip'+(s==='All'?' active':''), s);
    chip.onclick=()=>{ active=s; filterBar.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); chip.classList.add('active'); render(); };
    filterBar.appendChild(chip);
  });
  sec.appendChild(filterBar);
  const list = el('div');
  sec.appendChild(list);

  function render(){
    list.innerHTML='';
    const q=search.value.trim().toLowerCase();
    let items = ALL_CASES.filter(c=>{
      if(active==='Needs practice') return progress.needsPractice.has(c.id);
      if(active==='Learned') return progress.learned.has(c.id);
      if(active!=='All') return c.section===active;
      return true;
    }).filter(c=> !q || (c.name+' '+c.section).toLowerCase().includes(q));
    items.forEach(c=>{
      const card = el('div','card');
      card.innerHTML = '<div class="case-top"><div class="case-title">'+c.name+' <span class="pill">'+c.section+'</span></div></div>';
      const hideWrap = el('div');
      let revealed=false;
      const moveHolder = el('div','moves');
      function draw(){
        moveHolder.innerHTML='';
        if(revealed) parseAlg(c.algorithm).forEach(m=>moveHolder.appendChild(el('span','mv',m)));
        else moveHolder.appendChild(el('span','dim','••• hidden — try to recall it, then reveal •••'));
      }
      draw();
      const btnRow = el('div','btn-row'); btnRow.style.margin='8px 0';
      const revealBtn = el('button','btn small','Reveal');
      revealBtn.onclick=()=>{ revealed=!revealed; draw(); revealBtn.textContent = revealed?'Hide':'Reveal'; };
      const easyBtn = el('button','btn small','Easy');
      const practiceBtn = el('button','btn small','Needs Practice');
      const hardBtn = el('button','btn small','Difficult');
      easyBtn.onclick=()=>{ progress.learned.add(c.id); progress.needsPractice.delete(c.id); progress.difficult.delete(c.id); };
      practiceBtn.onclick=()=>{ progress.needsPractice.add(c.id); progress.learned.delete(c.id); };
      hardBtn.onclick=()=>{ progress.difficult.add(c.id); progress.needsPractice.add(c.id); progress.learned.delete(c.id); };
      btnRow.appendChild(revealBtn); btnRow.appendChild(easyBtn); btnRow.appendChild(practiceBtn); btnRow.appendChild(hardBtn);
      hideWrap.appendChild(moveHolder); hideWrap.appendChild(btnRow);
      card.appendChild(hideWrap);
      list.appendChild(card);
    });
    if(!items.length) list.appendChild(el('p','dim','Nothing here yet.'));
  }
  search.oninput = debounce(render);
  render();
}

function buildRecognition(sec){
  sec.innerHTML = '<div class="eyebrow">Practice</div><h1>Recognition Trainer</h1>'+
    '<p class="section-intro">The cube is set to a random case. Pick which one it is before you\'d reach for an algorithm — recognition speed is what separates fast solvers from slow ones, more than move speed does.</p>';
  const {panel} = makeCubePanel({withMovepad:false});
  sec.appendChild(panel);
  const visualEl = panel.querySelector('.cube-visual');
  visualEl.style.position='relative';
  const flashOverlay = el('div','flash-overlay');
  flashOverlay.style.display='none';
  flashOverlay.innerHTML = '<div>🧠 Recall the case…<div class="flash-count"></div></div>';
  visualEl.appendChild(flashOverlay);
  const flashCount = flashOverlay.querySelector('.flash-count');

  // Section filter — matching real training, where you drill one family
  // (F2L / OLL / PLL) at a time rather than guessing across unrelated stages.
  const sections = ['All','F2L','OLL','PLL'];
  let activeSection = 'All';
  const filterBar = el('div','recog-filterbar');
  sections.forEach(s=>{
    const chip = el('button','recog-chip'+(s===activeSection?' active':''), s);
    chip.onclick=()=>{ activeSection=s; [...filterBar.children].forEach(c=>c.classList.toggle('active',c.textContent===s)); newQuestion(); };
    filterBar.appendChild(chip);
  });
  sec.appendChild(filterBar);

  // Mode: Full view (cube stays visible, untimed lookup) vs Flash (a real
  // glance-then-recall drill — the cube disappears after a short window and
  // you pick from memory, which is much closer to recognizing mid-solve
  // than staring at a static state).
  let mode = 'full';
  let flashMs = 1000;
  const modeBar = el('div','recog-filterbar');
  const modeChips = {};
  ['Full view','Flash glance'].forEach(m=>{
    const chip = el('button','recog-chip'+(m==='Full view'?' active':''), m);
    chip.onclick=()=>{ mode = m==='Full view'?'full':'flash'; Object.values(modeChips).forEach(c=>c.classList.remove('active')); chip.classList.add('active'); durBar.style.display = mode==='flash'?'flex':'none'; newQuestion(); };
    modeChips[m]=chip;
    modeBar.appendChild(chip);
  });
  sec.appendChild(modeBar);

  const durBar = el('div','recog-filterbar');
  durBar.style.display='none';
  [500,1000,1500].forEach(ms=>{
    const chip = el('button','recog-chip'+(ms===flashMs?' active':''), (ms/1000)+'s');
    chip.onclick=()=>{ flashMs=ms; durBar.querySelectorAll('.recog-chip').forEach(c=>c.classList.remove('active')); chip.classList.add('active'); newQuestion(); };
    durBar.appendChild(chip);
  });
  sec.appendChild(durBar);

  const quiz = el('div','card quiz-card');
  sec.appendChild(quiz);
  const statLine = el('p','dim');
  sec.appendChild(statLine);

  function pool(){
    const base = ALL_CASES.filter(c=>c.playable!==false);
    return activeSection==='All' ? base : base.filter(c=>c.section===activeSection);
  }

  function avgTime(){
    if(!progress.recog.times.length) return null;
    return progress.recog.times.reduce((a,b)=>a+b,0)/progress.recog.times.length;
  }

  function renderStats(){
    const acc = progress.recog.attempts? Math.round(100*progress.recog.correct/progress.recog.attempts)+'%':'—';
    const t = avgTime();
    statLine.textContent = 'Session accuracy: '+progress.recog.correct+' / '+progress.recog.attempts+' ('+acc+')'+
      (t!==null? '  ·  avg recognition time: '+t.toFixed(1)+'s' : '');
  }
  renderStats();

  let qStart = null;
  let flashTimer = null;
  let flashTickInterval = null;
  let questionToken = 0;

  function newQuestion(){
    const myToken = ++questionToken;
    if(flashTimer){ clearTimeout(flashTimer); flashTimer=null; }
    if(flashTickInterval){ clearInterval(flashTickInterval); flashTickInterval=null; }
    quiz.innerHTML='';
    flashOverlay.style.display='none';
    const p = pool();
    if(p.length<2){ quiz.appendChild(el('p','dim','Not enough playable cases in this filter yet.')); return; }
    const correct = p[Math.floor(Math.random()*p.length)];
    resetCube();
    applyMovesSilently(parseAlg(inverseAlg(correct.algorithm)));
    renderCube();
    updateCubeStatus();

    // Prefer wrong options from the SAME section as the correct answer —
    // options plucked from other stages (e.g. an F2L name next to an OLL
    // cube state) are trivially eliminable and don't actually test
    // recognition of the pattern itself.
    const sameSectionPool = p.filter(c=>c.section===correct.section);
    const optionSourcePool = sameSectionPool.length>=4 ? sameSectionPool : p;
    const options = new Set([correct.name]);
    let guard=0;
    while(options.size<Math.min(4,optionSourcePool.length) && guard<200){
      options.add(optionSourcePool[Math.floor(Math.random()*optionSourcePool.length)].name);
      guard++;
    }
    const opts = [...options].sort(()=>Math.random()-0.5);

    if(mode==='flash'){
      // Glance phase: cube visible, no options yet, counting down.
      quiz.appendChild(el('h3','','Memorize the case… ('+correct.section+')'));
      quiz.appendChild(el('p','dim','Options appear once the cube hides.'));
      let remaining = flashMs/1000;
      flashCount.textContent = remaining.toFixed(1)+'s';
      flashTickInterval = setInterval(()=>{
        remaining -= 0.1;
        flashCount.textContent = Math.max(0,remaining).toFixed(1)+'s';
        if(remaining<=0){ clearInterval(flashTickInterval); flashTickInterval=null; }
      },100);
      flashTimer = setTimeout(()=>{
        if(myToken!==questionToken) return;
        flashOverlay.style.display='flex';
        renderQuizBody();
      }, flashMs);
    } else {
      renderQuizBody();
    }

    function renderQuizBody(){
      quiz.innerHTML='';
      quiz.appendChild(el('h3','','Which case is this? ('+correct.section+')'));

      // Hint: surfaces the same recognition cue an experienced solver relies
      // on (piece pattern, not the algorithm) — separate from the answer, so
      // using it still requires matching the description to the cube state.
      const hintBtn = el('button','btn small','Show recognition hint');
      const hintBox = el('div','hint-box');
      hintBox.style.display='none';
      hintBox.innerHTML = '<b>Look for:</b> '+(correct.recognition||'—');
      let hintUsed=false;
      hintBtn.onclick=()=>{ hintUsed=true; hintBox.style.display='block'; hintBtn.disabled=true; };
      quiz.appendChild(hintBtn);
      quiz.appendChild(hintBox);

      const optWrap = el('div','quiz-options');
      qStart = performance.now();
      opts.forEach(name=>{
        const b = el('button', null, name);
        b.onclick=()=>{
          const elapsed = (performance.now()-qStart)/1000;
          progress.recog.attempts++;
          progress.recog.times.push(elapsed);
          const isRight = name===correct.name;
          if(isRight) progress.recog.correct++;

          const cs = progress.recog.byCase[correct.id] || (progress.recog.byCase[correct.id]={attempts:0,correct:0});
          cs.attempts++;
          if(isRight) cs.correct++;
          // Auto-flag cases you're consistently missing so they surface on
          // the Dashboard without needing to remember to flag them manually.
          if(cs.attempts>=3 && cs.correct/cs.attempts<0.5) progress.needsPractice.add(correct.id);
          else if(isRight && cs.attempts>=3 && cs.correct/cs.attempts>=0.8) progress.needsPractice.delete(correct.id);

          hintBtn.disabled=true;
          flashOverlay.style.display='none';
          [...optWrap.children].forEach(btn=>{
            if(btn.textContent===correct.name) btn.classList.add('correct');
            else if(btn===b && !isRight) btn.classList.add('wrong');
            btn.disabled=true;
          });
          renderStats();
          const explain = el('div','card');
          explain.style.marginTop='10px';
          const tag = el('span','timer-chip', elapsed.toFixed(1)+'s'+(hintUsed?' · hint used':''));
          explain.appendChild(tag);
          explain.appendChild(makeAlgoPlayer(correct.algorithm,{name:correct.name+' — '+(correct.recognition||''), why:correct.why, playable:correct.playable!==false}));
          const nextBtn = el('button','btn primary','Next case →');
          nextBtn.onclick=newQuestion;
          quiz.appendChild(explain);
          quiz.appendChild(nextBtn);
        };
        optWrap.appendChild(b);
      });

    why:'A slightly longer cousin of the sexy move that shows up as a self-contained fragment inside several OLL and F2L algorithms.'},

    why:'A short "open the front, sexy move, close the front" wrap. It\'s the entire T-shape OLL algorithm by itself (OLL 45), and the same wrap shows up as a chunk inside several longer algorithms.'},
];

/* Splits an algorithm's move tokens into segments, tagging any that match a
   Common Trigger verbatim (longest triggers checked first, so e.g. Sune
   isn't mis-tagged as a plain sexy move). Consecutive untagged moves are
   merged into one plain segment. Used to color-code and label algorithm
   displays the way a good trigger-breakdown reference sheet would. */
function segmentAlgorithm(tokens){
  const sortedTriggers = COMMON_TRIGGERS.slice().sort((a,b)=> parseAlg(b.moves).length - parseAlg(a.moves).length);
  const segments = [];
  let i = 0;
  while(i < tokens.length){
    let found = null;
    for(const trig of sortedTriggers){
      const t = parseAlg(trig.moves);
      if(i+t.length > tokens.length) continue;
      let ok = true;
      for(let j=0;j<t.length;j++){ if(tokens[i+j]!==t[j]){ ok=false; break; } }
      if(ok){ found = {trigger:trig, len:t.length}; break; }
    }
    if(found){
      segments.push({start:i, len:found.len, trigger:found.trigger});
      i += found.len;
    } else {
      const last = segments[segments.length-1];
      if(last && !last.trigger) last.len++;
      else segments.push({start:i, len:1, trigger:null});
      i++;
    }
  }
  return segments;
}

function algContainsTrigger(algorithm, trigger){
  const a = parseAlg(algorithm), t = parseAlg(trigger);
  for(let i=0; i+t.length<=a.length; i++){
    let ok = true;
    for(let j=0; j<t.length; j++){ if(a[i+j]!==t[j]){ ok=false; break; } }
    if(ok) return true;
  }
  return false;
}

/* =========================================================================
   SCAN YOUR CUBE — photo-based case recognition
   Best-effort, on-device only (no photos ever leave the browser). Works by
   letting you drag a handful of dots onto the stickers in your photo, then
   comparing the colors it samples there against every playable OLL/PLL
   case's real solved-from-scrambled fingerprint (computed with this app's
   own cube engine via computeCaseState/inverseAlg — the exact same code
   path the case pages use, not a separate guess).
   ========================================================================= */
let scanCaseIndex = null;
function buildScanCaseIndex(){
  if(scanCaseIndex) return scanCaseIndex;
  const ringIdx = [0,1,2,5,8,7,6,3]; // clockwise around the U face, skipping the center
  const oll = OLL_CASES.filter(c=>c.playable).map(c=>{
    const state = computeCaseState(c);
    return {case:c, pattern: ringIdx.map(i=>state.U[i]==='U')};
  });
  // PLL: rather than asking the person to identify which physical face is
  // "front" or "right" (a cube has no such marking), the two dot groups
  // (A and B) just mean "whichever two adjacent last-layer faces you can
  // see, left one first." The 4 rotations below cover every possible
  // starting angle (AUF) for that same left-to-right reading, which is all
  // that's actually ambiguous once the dots are placed by the geometric
  // rule shown in the instructions (A ends at the seam, B starts there).
  const order = ['F','R','B','L'];
  const pll = PLL_CASES.filter(c=>c.playable!==false).map(c=>{
    const state = computeCaseState(c);
    const rotations = [];
    for(let r=0;r<4;r++){
      const f1=order[r], f2=order[(r+1)%4];
      rotations.push(state[f1].slice(0,3).concat(state[f2].slice(0,3)));
    }
    return {case:c, rotations};
  });
  scanCaseIndex = {oll, pll};
  return scanCaseIndex;
}

function colorDist(a,b){
  return Math.sqrt((a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2);
}

// Real cube photos have heavy lighting gradients (glare on one sticker,
// shadow on the one next to it) which throws off plain RGB-distance
// matching — the same red sticker can read as very different RGB values
// depending on where the light hits it. Converting to HSV and comparing
// mostly by hue (with a separate achromatic path for white) is much more
// forgiving of that, since hue barely shifts with brightness.
function rgbToHsv([r,g,b]){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if(d!==0){
    if(max===r) h=((g-b)/d)%6;
    else if(max===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60; if(h<0) h+=360;
  }
  const s = max===0?0:d/max;
  const v = max;
  return [h,s,v];
}
function colorsMatch(a,b){
  const [h1,s1,v1] = rgbToHsv(a);
  const [h2,s2,v2] = rgbToHsv(b);
  const bothPale = s1<0.22 && s2<0.22; // white stickers (and blown-out glare) read as low-saturation
  if(bothPale) return Math.abs(v1-v2) < 0.28;
  if(s1<0.22 || s2<0.22) return false; // one pale, one saturated — definitely different stickers
  let dh = Math.abs(h1-h2); if(dh>180) dh = 360-dh;
  return dh < 28;
}

  function resetScan(){
    stageWrap.innerHTML=''; actionRow.style.display='none'; swatchHint.style.display='none'; resultsWrap.innerHTML=''; canvas=null;
  }
  resetBtn.onclick = ()=>{ fileInput.value=''; resetScan(); };

  function makeDraggable(dot, stage){
    let dragging=false;
    const move = (clientX, clientY)=>{
      const r = stage.getBoundingClientRect();
      let x = ((clientX-r.left)/r.width)*100, y=((clientY-r.top)/r.height)*100;
      x = Math.max(0,Math.min(100,x)); y = Math.max(0,Math.min(100,y));
      dot.style.left = x+'%'; dot.style.top = y+'%';
    };
    dot.addEventListener('pointerdown', e=>{ dragging=true; dot.setPointerCapture(e.pointerId); e.preventDefault(); });
    dot.addEventListener('pointermove', e=>{ if(dragging) move(e.clientX,e.clientY); });
    dot.addEventListener('pointerup', ()=>{ dragging=false; });
    dot.addEventListener('pointercancel', ()=>{ dragging=false; });
  }

  function sampleDot(dot){
    const x = Math.round(((parseFloat(dot.style.left))/100)*canvas.width);
    const y = Math.round(((parseFloat(dot.style.top))/100)*canvas.height);
    const size=16;
    const sx=Math.max(0,x-size/2), sy=Math.max(0,y-size/2);
    const sw=Math.min(size, canvas.width-sx), sh=Math.min(size, canvas.height-sy);
    const data = ctx.getImageData(sx,sy,Math.max(1,sw),Math.max(1,sh)).data;
    // Median per channel rather than mean — a stray row of blown-out glare
    // or a shadow edge caught in the sample box skews an average a lot
    // more than it skews a median.
    const rs=[],gs=[],bs=[];
    for(let i=0;i<data.length;i+=4){ rs.push(data[i]); gs.push(data[i+1]); bs.push(data[i+2]); }
    const med = arr=>{ const s=arr.slice().sort((a,b)=>a-b); return s[Math.floor(s.length/2)]; };
    return [med(rs), med(gs), med(bs)];
  }

  function paintSwatches(assignments){
    // Color each dot to show exactly what was sampled there — if a dot
    // looks nothing like the sticker it's sitting on, that's the sign to
    // nudge it and rescan, rather than wonder why the match looks wrong.
    assignments.forEach(([dot,color])=>{
      dot.style.background = 'rgb('+color.map(Math.round).join(',')+')';
      dot.style.borderColor = '#fff';
    });
  }

  scanBtn.onclick = ()=>{
    if(!canvas) return;
    try{
      const idx = buildScanCaseIndex();
      resultsWrap.innerHTML='';
      if(mode==='oll'){
        const centerColor = sampleDot(dots.center);
        const ringKeys = ['r0','r1','r2','r3','r4','r5','r6','r7'];
        const ringColors = ringKeys.map(k=>sampleDot(dots[k]));
        paintSwatches([[dots.center,centerColor], ...ringKeys.map((k,i)=>[dots[k],ringColors[i]])]);
        const sample = ringColors.map(c=> colorsMatch(c, centerColor));
        const scored = idx.oll.map(entry=>{
          let best=-1;
          for(let rot=0; rot<8; rot+=2){
            let score=0;
            for(let i=0;i<8;i++){ if(sample[i]===entry.pattern[(i+rot)%8]) score++; }
            if(score>best) best=score;
          }
          return {case:entry.case, score:best, max:8};
        });
        if(!scored.length){ resultsWrap.appendChild(el('p','dim','No playable OLL cases were available to compare against — this shouldn\'t happen; please reload the page.')); return; }
        renderScanResults(scored);
      } else {
        const keys = ['a0','a1','a2','b0','b1','b2'];
        const colors = keys.map(k=>sampleDot(dots[k]));
        paintSwatches(keys.map((k,i)=>[dots[k],colors[i]]));
        const pairs=[]; for(let i=0;i<6;i++) for(let j=i+1;j<6;j++) pairs.push([i,j]);
        const sampleEq = pairs.map(([i,j])=> colorsMatch(colors[i],colors[j]));
        const scored = idx.pll.map(entry=>{
          let best=-1;
          entry.rotations.forEach(rotArr=>{
            let score=0;
            pairs.forEach(([i,j],pi)=>{
              const eq = rotArr[i]===rotArr[j];
              if(eq===sampleEq[pi]) score++;
            });
            if(score>best) best=score;
          });
          return {case:entry.case, score:best, max:pairs.length};
        });
        if(!scored.length){ resultsWrap.appendChild(el('p','dim','No playable PLL cases were available to compare against — this shouldn\'t happen; please reload the page.')); return; }
        renderScanResults(scored);
      }
    } catch(err){
      console.error('Scan failed', err);
      resultsWrap.innerHTML='';
      resultsWrap.appendChild(el('p','dim','Scanning hit an error ('+err.message+'). Try retaking the photo — if it keeps happening, this browser may be blocking pixel access on the photo (some strict privacy modes do this).'));
    }
  };

  function renderScanResults(scored){
    scored.sort((a,b)=>b.score-a.score);
    const top = scored.slice(0,3);
    resultsWrap.appendChild(el('h3','', 'Closest matches'));
    resultsWrap.appendChild(el('p','dim','Not confident it nailed it? Check the next case or two below — they\'re ranked by how closely the colors lined up.'));
    top.forEach((t,i)=>{
      const pct = Math.round((t.score/t.max)*100);
      const row = el('div','scan-result-card');
      row.appendChild(el('div','scan-result-rank', '#'+(i+1)));
      const info = el('div'); info.style.flex='1';
      info.innerHTML = '<div class="case-title">'+t.case.name+' <span class="dim" style="font-weight:400;">('+t.case.group+')</span></div>'+
        '<div class="dim" style="font-size:.8rem;margin-top:2px;">'+pct+'% color match</div>'+
        '<div class="scan-confidence-bar"><div class="scan-confidence-fill" style="width:'+pct+'%;"></div></div>';
      row.appendChild(info);
      row.appendChild(el('span','case-open-arrow','→'));
      row.onclick=()=>openCasePlayer(t.case.id);
      resultsWrap.appendChild(row);
    });
  }
}


renderSidebar();
showSection('home');
const mobileSoundBtn = document.querySelector('.mobile-sound-toggle');
if(mobileSoundBtn) mobileSoundBtn.onclick = ()=> setSoundEnabled(!soundEnabled);

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
